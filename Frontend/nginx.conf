# Serves the built SPA. Deliberately contains no /api proxy block: nginx
# resolves a literal upstream hostname at startup and refuses to start if it
# does not exist, which would make this image fail on any host where the API is
# not a sibling container. The bundle carries an absolute VITE_API_BASE_URL
# instead, so the browser talks to the API directly.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name, so they cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every unknown path is a client route, not a 404. This is
    # what makes a deep link such as /finance/audit survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
