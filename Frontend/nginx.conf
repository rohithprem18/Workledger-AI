server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name, so they cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In the compose stack the API is a sibling container. On a split deploy
    # (static host + separate API host) this block is unused and the frontend
    # talks to VITE_API_BASE_URL instead.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
