spring:
  application:
    name: workledger-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    # Flyway owns the schema. Hibernate only verifies that the entities match it,
    # so a mapping that has drifted from a migration fails at startup rather than
    # silently altering tables under a running system.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # ---------------------------------------------------------------------------
  # Generative layer. Any OpenAI-compatible endpoint works — set AI_BASE_URL and
  # AI_MODEL to match your provider. See docs/DEPLOYMENT.md for free options.
  # ---------------------------------------------------------------------------
  ai:
    openai:
      api-key: ${AI_API_KEY:not-configured}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}
          # Extraction and explanation are reporting tasks, not creative ones.
          temperature: 0.0

workledger:
  ai:
    # Off by default: every AI-assisted feature has a deterministic engine behind
    # it, so the platform is fully functional with no API key and no spend.
    enabled: ${AI_ENABLED:false}
    engine-label: ${AI_ENGINE_LABEL:groq/llama-3.3-70b}
    max-source-chars: 24000
    timeout-seconds: 60

jwt:
  secret: ${JWT_SECRET:ChangeMeInProductionThisMustBeAtLeast32CharactersLong}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  # Render, Railway and Fly inject PORT; honouring it keeps deploys config-free.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM_EMAIL:no-reply@workledger.example}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    max-age: 3600
  security:
    rate-limit:
      login:
        requests: ${LOGIN_RATE_LIMIT:20}
        duration-minutes: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    backend.WF: ${LOG_LEVEL:INFO}
