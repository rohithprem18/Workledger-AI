# Local development. Inherits everything from application.yml; only the
# differences that matter for working on a laptop are set here.
spring:
  jpa:
    show-sql: true

logging:
  level:
    backend.WF: DEBUG
    org.springframework.security: INFO

app:
  security:
    rate-limit:
      login:
        # Loose enough not to lock yourself out while testing the login screen.
        requests: 100
        duration-minutes: 1

springdoc:
  swagger-ui:
    enabled: true
