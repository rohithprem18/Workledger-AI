# Production. Every secret comes from the environment and has no default, so a
# missing one fails the deploy loudly instead of silently running insecurely.
#
# TLS is terminated by the hosting platform (Render, Railway, Fly all do this),
# which is why no keystore is configured here. `forward-headers-strategy` in
# application.yml is what makes Spring see the original https scheme.
spring:
  # The datasource is resolved in one of two ways, in this order:
  #   1. DATABASE_URL (postgres://...), which Render, Railway, Heroku and Fly
  #      all inject — DatabaseUrlEnvironmentPostProcessor converts it to JDBC.
  #   2. DB_URL / DB_USERNAME / DB_PASSWORD from application.yml, for anywhere
  #      that hands over the parts separately.
  # Neither is repeated here, so there is exactly one place each is defined.
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    rate-limit:
      login:
        requests: ${LOGIN_RATE_LIMIT:5}
        duration-minutes: 1

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    backend.WF: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
