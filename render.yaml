# One-click deploy to Render's free tier: Postgres + the API + the static frontend.
#
# Render reads this file when you create a Blueprint from the repository. Every
# service below sits on a free plan. The two values it cannot generate for you —
# the AI key and the email key — are marked sync:false and are prompted for at
# deploy time; both are optional, and the platform runs fully without either.
#
# Note on the free tier: web services sleep after inactivity and the free
# Postgres instance expires after 90 days. Fine for a demo, not for production.

databases:
  - name: workledger-db
    databaseName: workledger
    user: workledger
    plan: free

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: workledger-api
    runtime: docker
    plan: free
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render hands over a postgres:// URL. DatabaseUrlEnvironmentPostProcessor
      # converts it to the jdbc: form and splits out the credentials at startup,
      # so nothing has to be transcribed by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: workledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render cannot prepend a scheme to a fromService host, and CORS needs a
      # full origin. Set this once after the first deploy to the frontend's URL,
      # e.g. https://workledger-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: no-reply@workledger.example

  # ------------------------------------------------------------- frontend
  - type: web
    name: workledger-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Same reason: this must be the API's full base URL including /api,
      # e.g. https://workledger-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Client-side routing: serve the app for any path the build did not emit.
      - type: rewrite
        source: /*
        destination: /index.html
