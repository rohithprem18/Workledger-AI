# Full local stack: database, API, and the built frontend behind nginx.
#
#   docker compose up --build
#   → http://localhost:3000   the app
#   → http://localhost:8080/swagger-ui.html   the API
#
# Everything here runs on free, open-source images. To light up the AI features,
# put AI_ENABLED=true and an AI_API_KEY in a .env file next to this one; without
# them the platform runs complete on its deterministic engines.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API's Flyway migration fails if it connects before Postgres is
      # accepting queries, so the dependency below waits on this.
      test: ["CMD-SHELL", "pg_isready -U postgres -d workledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/workledger
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-LocalDevelopmentSecretChangeMeBeforeAnyDeployment}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-no-reply@workledger.example}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      args:
        # Relative, so nginx proxies /api to the backend container.
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
