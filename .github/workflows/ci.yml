name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API · typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Strict TypeScript is the first line of defence here: the API has no
      # compile step in production, so a type error would otherwise surface as
      # a runtime failure in a serverless function.
      - name: Typecheck
        run: npm run typecheck

      # The domain logic under test — overlap detection, citation verification,
      # every reconciliation rule — is pure, so none of it needs a database.
      - name: Test
        run: npm test

  migrations:
    name: Migrations · apply to a real PostgreSQL
    runs-on: ubuntu-latest

    # Applied against a real instance because the schema uses JSONB,
    # TIMESTAMPTZ and gen_random_uuid(), none of which an embedded database
    # reproduces faithfully enough for the check to mean anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workledger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workledger_test
        run: npm run migrate

      # Re-running must be a no-op. A migration that is not idempotent would
      # break every deploy after the first.
      - name: Re-run is a no-op
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workledger_test
        run: npm run migrate

  web:
    name: Frontend · lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        working-directory: Frontend
        run: npm ci

      - name: Lint
        working-directory: Frontend
        run: npm run lint

      - name: Build
        working-directory: Frontend
        run: npm run build
