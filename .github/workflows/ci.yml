name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest

    # A real PostgreSQL instance, so the migrations run and the JPA mappings are
    # validated against the schema they will actually meet in production. An
    # embedded database would not reproduce JSONB, TIMESTAMPTZ or
    # gen_random_uuid() faithfully enough for that check to mean anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workledger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: Backend
        env:
          # Presence of DB_URL is what enables the full-context test.
          DB_URL: jdbc:postgresql://localhost:5432/workledger_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: CiOnlySecretThatIsAtLeastThirtyTwoCharactersLong
          # The AI path stays off in CI: tests must not depend on a third-party
          # endpoint being reachable, and the deterministic engines are the ones
          # under test anyway.
          AI_ENABLED: 'false'
        run: mvn -B verify

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Backend/target/surefire-reports/

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        working-directory: Frontend
        run: npm ci

      - name: Lint
        working-directory: Frontend
        run: npm run lint

      - name: Build
        working-directory: Frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Building both images on every green build means a deploy never fails for
      # a reason CI could have caught.
      - name: Build backend image
        run: docker build -t workledger-api:ci ./Backend

      - name: Build frontend image
        run: docker build -t workledger-web:ci ./Frontend
